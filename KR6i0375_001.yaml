body:
  text: 昔孤山法師嘗作蘭盆禮讚文三寶目連共為六位啓白懺悔各四句而已仍用常途羅漢禮請之聲後真悟律師更為天竺祖禮唱之遂加啓請冠于讚首移孤山四句以為歎佛豫謂釋子奉行蘭盆固當代為存亡露過陳悔又依經設供必先呪願此二乃法會之至要而昔皆遺之故今於歎佛後依經出呪願法又禮讚後別出悔文餘並仍舊貫無別改作有加圭峯一讚及勸請等偈今例不存各其志爾餘杭沙門釋元照重集初入道場三禮已互跪燒香散華首者唱云恭以牟尼化主大孝慈尊三祗功行告圓萬德莊嚴克備在因在果咸推孝順為宗居聖居凡皆以報恩為本尋以王宮誕瑞棄金輪而出家道樹證真伏天魔而成聖指三千為化境演八萬為法門親升忉利天中為摩耶而説法躬向迦維國內酬淨飯以擔棺覩目連救母無方示自恣盂蘭妙供使盆羅百味式貢三尊仰賢聖之威光濟自他之存沒今則爰當休夏聊展微肴普伸供獻之儀用答劬勞之德惟冀十方聖衆俱降道場同享克誠俯回昭鑒唱已一禮復跪執爐冥想衆聖請云一心奉請蘭盆教主久報親恩釋迦文佛唯願降臨道場受我供養三請一禮下同一心奉請蘭盆至教報親苦法門修多羅藏一心奉請十方自恣得道聖賢菩薩僧衆一心奉請十方自恣得道聖賢緣覺僧衆一心奉請十方自恣得道聖賢聲聞僧衆一心奉請報親入道起教利生目連尊者請已起立稱歎三寶同聲呪願稽首釋迦真教法三乘賢聖目連尊我今稟教報親恩願軫慈悲聽讚歎我等各為報答所生父母罔極深恩具飯百味五果香油挺燭供養三寶十方自恣大德衆僧願使現在父母壽命百年無一切苦惱之患乃至七世父母離餓鬼苦生人天中福樂無極遍周法界無量衆生承此熏修俱沾利樂三遍或更陳敘宣疏或念佛等臨時自裁然後禮讚唱云一心頂禮蘭盆教主久報親恩釋迦文佛歷劫修行成聖道目連哀請演真乘父王反拜踊虗空田主聞言解羅網修因證果同歸孝化他自行盡酬恩願回慈眼視衆生令彼存亡皆受賜故我一心歸命頂禮此同聲和已三禮下並同一心頂禮蘭盆至教報親拔苦法門修多羅藏金口廣談無量教報親唯此應機緣拔苦偏稱自恣僧垂慈更示蘭盆法慶喜宣傳言已備曇摩翻譯道彌光王臣貴賤悉遵行妙訓明明逾日月一心頂禮十方自恣得道聖賢菩薩僧衆悲智俱修稱大士上求下化歷僧祇濟物長乘六度舟利他悉到三空岸內證將臻諸佛境隨緣或現比丘形而今既降道場來願使存亡皆離苦一心頂禮十方自恣得道聖賢緣覺僧衆利智不因師匠授諦觀緣起悟無生説法傳燈號部行修心無侶稱麟喻真空頓了看華謝煩惱全除聽釧聲而今既降道場來願使存亡皆離苦一心頂禮十方自恣得道聖賢聲聞僧衆山間樹下安居勝四諦深觀得有餘暄喧生死果全傾寂寂涅槃心已證六通自在超魔境八解逍遙號福田而今既降道場來願使存亡皆離苦一心頂禮報親入道起教利生目連尊者神通第一居無學為報親恩乃出家自力難除慈母殃哀號遂奉如來教發起微言資後世揄揚孝道利羣生而今既降道場來願使存亡皆離苦讚已互跪追想存亡父母懇切至誠懺悔至心懺悔我等所生父母多世親緣自背真常長流生死順無明之倒想隨欲境以攀緣恣放六情故為十惡貪嗔邊見殺盜邪淫兩舌惡口以欺誣綺語妄言而誑惑加以吝財荒色酣酒嗜音慢辱僧尼輕陵佛法餐噉衆生血肉傷殘無量合靈不思萬劫之殃但顧一時之美或現遭厄難或後受沈淪忝當割愛出家理合修身報德幸值佛歡喜日僧自恣時仰遵調御法門式奉盂蘭盆供但以生緣義重哀慕情深由是輒敘瑕疵代申懺悔仗三寶威神加被衆僧功行冥熏令彼罪根俱時除滅亡沒遷神於天上永脫冥途生存保壽於人間常無病惱善根彌固正信增深俱出輪回盡生安養無緣普覆有感遂通願賜哀憐俯垂護念三遍懺悔已至心歸命頂禮此一人唱已一禮起繞旋唱云南無十方佛南無十方法南無十方僧南無蘭盆教主釋迦文佛南無蘭盆至教修多羅藏南無十方自恣菩薩僧衆南無十方自恣緣覺僧衆南無十方自恣聲聞僧衆南無報親入道目連尊者旋繞三稱已諷盂蘭盆經或餘經等盡誠便散紹興甲子季夏比丘宗炬重寫募緣刊板流通各為生身父母歷劫親緣懺滌罪根莊嚴淨土
